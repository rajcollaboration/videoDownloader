<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0e2044;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2371ff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#38bdf8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative orbs -->
  <circle cx="100" cy="100" r="200" fill="#2371ff" opacity="0.08"/>
  <circle cx="1100" cy="530" r="240" fill="#10b981" opacity="0.07"/>
  <!-- Logo badge -->
  <rect x="80" y="72" width="64" height="64" rx="16" fill="url(#accent)"/>
  <text x="112" y="114" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">CF</text>
  <!-- Brand name -->
  <text x="160" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="36" font-weight="900" fill="url(#accent)">ClipFetch</text>
  <!-- Main headline -->
  <text x="80" y="240" font-family="ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="900" fill="white">Download Any Video</text>
  <text x="80" y="330" font-family="ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="900" fill="url(#accent)">Free &amp; Instantly</text>
  <!-- Subtext -->
  <text x="80" y="405" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" fill="#94a3b8">Instagram Reels &amp; Facebook Videos · No sign-up required</text>
  <!-- Feature badges -->
  <rect x="80" y="460" width="200" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
  <text x="180" y="491" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700">4K Quality</text>
  <rect x="300" y="460" width="220" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
  <text x="410" y="491" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700">MP4 &amp; MP3</text>
  <rect x="540" y="460" width="200" height="48" rx="24" fill="#ffffff" opacity="0.08"/>
  <text x="640" y="491" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700">100% Free</text>
</svg>
