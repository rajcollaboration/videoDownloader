services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      INTERNAL_API_BASE_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - backend
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - postgres
      - redis
    networks:
      - appnet

  worker:
    build:
      context: ./backend
    # --concurrency controls how many playlist items download in parallel
    # per worker container. Raise via the CELERY_CONCURRENCY env var for
    # heavier machines.
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
      -Ofair
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - backend
      - redis
      - postgres
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    networks:
      - appnet

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

volumes:
  postgres_data:

networks:
  appnet:
