services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      INTERNAL_API_BASE_URL: "http://backend:8000"
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    ports:
      - "${FRONTEND_HOST_PORT:-3002}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - backend
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - postgres
      - redis
      - ai-worker
    networks:
      - appnet

  worker:
    build:
      context: ./backend
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
      -Q celery,video-download,transcription,clip-generation,cleanup
      -Ofair
    env_file:
      - .env
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - backend
      - redis
      - postgres
      - ai-worker
    networks:
      - appnet

  ai-worker:
    build:
      context: ./ai-worker
    env_file:
      - .env
    environment:
      INTERNAL_API_KEY: ${AI_WORKER_INTERNAL_KEY:-change-me-ai-key}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    volumes:
      - ./backend/storage:/app/storage
    restart: unless-stopped
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    networks:
      - appnet

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet

volumes:
  postgres_data:

networks:
  appnet:
